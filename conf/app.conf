# 用户昵称等自填文本的违禁词库；留空则关闭过滤。改动词库文件无需重启，10 秒内自动热加载。
sensitiveWordsFile = "conf/sensitive_words.txt"
frontendBaseDir = "../cc_0"
# 自定义属性反查（/api/get-users-by-custom-property）的访问白名单。
# 该接口跨组织全局查询，能把设备 ID 之类的值反解成账号，所以**默认关闭**：
# 此项为空时接口一律拒绝，即使调用方是管理员。
# 填调用方身份，逗号分隔，例如 "app/app-built-in,built-in/admin"
customPropertyLookupWhitelist =
# 可选：再叠加一层来源 IP 限制（CIDR，逗号分隔）。为空表示不限制来源 IP。
customPropertyLookupIpWhitelist =
